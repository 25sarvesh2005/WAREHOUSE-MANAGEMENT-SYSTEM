[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whitfield-warehouse-operations"
version = "0.1.0"
description = "Whitfield Fulfillment warehouse operations and seller visibility platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Whitfield Fulfillment Engineering", email = "engineering@whitfield.local" }
]
dependencies = [
    "alembic==1.13.2",
    "asyncpg==0.31.0",
    "bcrypt==4.1.3",
    "fastapi==0.111.1",
    "email-validator==2.2.0",
    "greenlet==3.5.5",
    "google-genai==2.18.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "passlib[bcrypt]==1.7.4",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "SQLAlchemy==2.0.31",
    "typer==0.12.3",
    "uvicorn[standard]==0.30.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff>=0.5.0",
]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
cache_dir = "tmp/.pytest_cache"
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:jose.jwt",
    "ignore:.*unclosed <socket.socket.*:ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
